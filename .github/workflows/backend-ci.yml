name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Disposable database for tests only. Supabase runs PostgreSQL 15/17.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papermark_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/papermark_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked, no AI extras)
        run: uv sync --frozen
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app scripts tests
      - name: Tests (unit + database + migrations)
        run: uv run python -m pytest -q
      - name: RLS guard on migrated schema
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          DATABASE_SSL: "false"
        run: |
          uv run alembic upgrade head
          uv run python -m scripts.check_rls
