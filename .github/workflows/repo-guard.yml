name: repo-guard

# Blocks secrets, environment files and student documents from entering the repository.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Forbidden files
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pdf|zip|xlsx?|dump|pem|key|p12|pfx)$' \
                | grep -vE '\.env\.example$|^backend/tests/fixtures/' || true)
          if [ -n "$bad" ]; then
            echo "Forbidden files are tracked:" >&2
            echo "$bad" >&2
            exit 1
          fi
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
